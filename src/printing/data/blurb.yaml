# Blurb provider definition.
# Source: https://www.blurb.com (Specifications calculator)
# Data points captured for Standard Portrait, Hardcover Dust Jacket:
#   Standard paper:  spine 1.905@200pgs, 2.328@240pgs  → caliper 0.01058 cm/pg
#   Premium paper:   spine 2.328@200pgs, 2.787@240pgs  → caliper 0.01148 cm/pg
# Hinge ≈ 0.9525 cm each side of spine (constant).
# Cover trim total: 64.77 cm (Standard) / 64.734 cm (Premium).

name: blurb
label: Blurb

products:
  standard_portrait_hardcover_dust_jacket:
    label: "Standard Portrait — Hardcover, Dust Jacket"
    page:
      trim_w_cm: 20.32
      trim_h_cm: 25.401
      bleed:
        top_cm: 0.317
        bottom_cm: 0.317
        outside_cm: 0.317
        inside_cm: 0.0
      safe_insets:
        outside_cm: 0.635
        binding_cm: 1.27
        top_cm: 0.635
        bottom_cm: 0.635
    cover:
      mode: wraparound
      bleed_cm: 0.317
      hinge_w_cm: 0.9525
      safe_inset_cm: 0.635
      trim_h_cm: 26.035   # = page trim_h_cm + 2 * bleed.top_cm (rounded to spec)
    paper_variants:
      standard:
        label: "Standard"
        spine_caliper_cm_per_page: 0.01058
        spine_offset_cm: -0.211
        max_pages: 440
        cover_trim_w_cm: 64.77
      premium:
        label: "Premium (lustre or matte)"
        spine_caliper_cm_per_page: 0.01148
        spine_offset_cm: 0.032
        max_pages: 240
        cover_trim_w_cm: 64.734
      proline:
        label: "ProLine (uncoated or pearl)"
        # Coefficients to be measured against Blurb calculator.
        # Provisional: same as Premium until verified.
        spine_caliper_cm_per_page: 0.01148
        spine_offset_cm: 0.032
        max_pages: 240
        cover_trim_w_cm: 64.734
    default_paper_variant: standard

  premium_magazine_85x11:
    label: "Premium Magazine — 8.5×11 in (22×28 cm)"
    page:
      trim_w_cm: 21.59
      trim_h_cm: 27.94
      bleed:
        top_cm: 0.317
        bottom_cm: 0.317
        outside_cm: 0.317
        inside_cm: 0.0
      safe_insets:
        outside_cm: 0.635
        binding_cm: 0.635
        top_cm: 0.635
        bottom_cm: 0.635
    cover:
      mode: embedded
      bleed_cm: 0.317
      hinge_w_cm: 0.0
      safe_inset_cm: 0.635
      trim_h_cm: 28.574
    paper_variants:
      standard:
        label: "Standard Magazine Paper"
        spine_caliper_cm_per_page: 0.0
        spine_offset_cm: 0.0
        max_pages: 240
        cover_trim_w_cm: 43.18
    default_paper_variant: standard
