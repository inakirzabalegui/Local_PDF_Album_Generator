# Default configuration for PDF Album Generator
# Applied to every new album created with --init.
# Each individual album can still override these in its own global_config.yaml.

# ─────────────────────────────────────────────────────────────────────────────
# Print provider
# ─────────────────────────────────────────────────────────────────────────────
# Definitions live in src/printing/data/<provider>.yaml.
# Available providers: peecho (A4), blurb, custom.
provider:
  name: peecho
  product: a4
  paper_variant: standard

# ─────────────────────────────────────────────────────────────────────────────
# Optional overrides (null = use provider value)
# ─────────────────────────────────────────────────────────────────────────────
overrides:
  page:
    trim_w_cm: null
    trim_h_cm: null
    bleed_top_cm: null
    bleed_bottom_cm: null
    bleed_outside_cm: null
    bleed_inside_cm: null
    safe_inset_outside_cm: null
    safe_inset_binding_cm: null
    safe_inset_top_cm: null
    safe_inset_bottom_cm: null
  cover:
    trim_w_cm: null
    trim_h_cm: null
    bleed_cm: null
    flap_w_cm: null
    spine_w_cm: null      # null = autocalc from page count
    hinge_w_cm: null
    safe_inset_cm: null
  rendering:
    binding_side_for_odd: left
    max_pages_per_volume: null   # null = use provider's max_pages

# ─────────────────────────────────────────────────────────────────────────────
# Image and composition defaults
# ─────────────────────────────────────────────────────────────────────────────

# Target resolution for image downsampling (DPI)
target_resolution_dpi: 300

# Min/max photos per page
photos_per_page_min: 6
photos_per_page_max: 9

# Default background color (RGB hex), used when ColorThief can't extract one
default_background_color: "#0000FF"

# System font (Helvetica, Times-Roman, Courier, ...)
typography_system_font: Helvetica

# Featured/hero weight multipliers
weight_destacada: 1.5
weight_protagonista: 2.5
